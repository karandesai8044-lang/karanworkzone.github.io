name: PR preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger Render deploy for PR branch
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != '' }}
        run: |
          curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": "${{ github.head_ref }}",
              "clearCache": false
            }'

      - name: Warn if Render secrets are missing
        if: ${{ env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == '' }}
        run: |
          echo "Render secrets are not configured. Add RENDER_API_KEY and RENDER_SERVICE_ID in GitHub repo secrets."
          exit 0
